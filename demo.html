<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>offline-form.js — Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; border-radius: 12px; padding: 32px; width: 100%; max-width: 500px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; margin-top: 16px; }
    input, textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    input:focus, textarea:focus, select:focus { border-color: #6c63ff; }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .check-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
    .check-row input { width: auto; }
    button {
      margin-top: 24px; width: 100%; padding: 12px;
      background: #6c63ff; color: #fff; border: none;
      border-radius: 8px; font-size: 15px; cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #5a52d5; }
    .status { margin-top: 16px; font-size: 13px; color: #888; text-align: center; }
    #log { margin-top: 24px; background: #f8f8f8; border-radius: 8px; padding: 12px; font-size: 12px; font-family: monospace; color: #444; min-height: 60px; }
    .badge { display: inline-block; background: #e8f5e9; color: #2e7d32; border-radius: 4px; padding: 2px 8px; font-size: 11px; margin-left: 6px; }
  </style>
</head>
<body>
<div class="card">
  <h1>offline-form.js <span class="badge">demo</span></h1>
  <p class="sub">Remplis le formulaire — recharge la page — tes données sont restaurées automatiquement ✨</p>

  <form id="inscription">
    <div class="row">
      <div>
        <label>Prénom</label>
        <input type="text" name="prenom" placeholder="Alice">
      </div>
      <div>
        <label>Nom</label>
        <input type="text" name="nom" placeholder="Martin">
      </div>
    </div>

    <label>Email</label>
    <input type="email" name="email" placeholder="alice@exemple.fr">

    <label>Pays</label>
    <select name="pays">
      <option value="">— Choisir —</option>
      <option value="fr">France</option>
      <option value="be">Belgique</option>
      <option value="ch">Suisse</option>
      <option value="ca">Canada</option>
    </select>

    <label>Message</label>
    <textarea name="message" placeholder="Ton message ici..."></textarea>

    <div class="check-row">
      <input type="checkbox" name="cgu" id="cgu">
      <label for="cgu" style="margin:0">J'accepte les CGU</label>
    </div>

    <button type="submit">Envoyer</button>
  </form>

  <p class="status">💾 Sauvegarde automatique active</p>
  <div id="log">En attente...</div>
</div>

<script type="module">
  import OfflineForm from './src/offline-form.js'

  const log = document.getElementById('log')
  const addLog = (msg) => {
    const line = document.createElement('div')
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`
    log.prepend(line)
  }

  OfflineForm.watch('#inscription', {
    debounce: 600,
    toast: true,
    onSave: (data) => {
      addLog(`💾 Sauvegardé — ${Object.keys(data).length} champs`)
    },
    onRestore: (data) => {
      addLog(`✅ Restauré — ${Object.keys(data).length} champs récupérés`)
    }
  })

  document.getElementById('inscription').addEventListener('submit', (e) => {
    e.preventDefault()
    addLog('📤 Formulaire soumis — cache effacé')
  })
</script>
</body>
</html>
